<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>远程连接管理器</title>
<link rel="stylesheet" href="/vendor/xterm/xterm.css">
<link rel="stylesheet" href="/css/style.css?v=20261117g">
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>远程连接管理器</h1>
    <div class="actions">
      <button id="btn-add" class="btn-primary">+ 新建连接</button>
      <button id="btn-keys" class="btn-secondary">密钥管理</button>
      <button id="btn-about" class="btn-secondary">关于</button>
    </div>
  </header>

  <main id="card-grid" class="card-grid"></main>

  <footer class="app-footer">
    <nav>
      <a href="https://stock.51pwn.com/" target="_blank" rel="noopener noreferrer">选股策略</a>
      <a href="https://chat.51pwn.com/" target="_blank" rel="noopener noreferrer">高匿聊天</a>
      <a href="https://gp.51pwn.com/" target="_blank" rel="noopener noreferrer">智见股市</a>
      <a href="https://aitag.51pwn.com" target="_blank" rel="noopener noreferrer">AI Tags</a>
      <a href="https://vi.51pwn.com/" target="_blank" rel="noopener noreferrer">见到你</a>
    </nav>
    <a href="https://www.github.com/hktalent/remote-connect-manager" target="_blank" rel="noopener noreferrer">GitHub</a>
  </footer>
</div>

<!-- Config Modal -->
<div id="config-modal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modal-title">新建连接</h2>
      <button class="close-btn" onclick="closeModal()">&times;</button>
    </div>
    <form id="config-form">
      <input type="hidden" name="id">
      <div class="modal-body">
      <div class="form-row">
        <label>名称</label>
        <input type="text" name="name" required>
      </div>
      <div class="form-row">
        <label>类型</label>
        <select name="type" id="conn-type" onchange="onTypeChange()">
          <option value="ssh">SSH</option>
          <option value="vnc">VNC</option>
          <option value="rdp">RDP</option>
          <option value="telnet">Telnet</option>
        </select>
      </div>
      <div class="form-row">
        <label>主机</label>
        <input type="text" name="host" required placeholder="192.168.1.1">
      </div>
      <div class="form-row">
        <label>端口</label>
        <input type="number" name="port" required>
      </div>
      <div class="form-row">
        <label>用户名</label>
        <input type="text" name="username">
      </div>
      <div id="auth-section">
        <div class="form-row">
          <label>认证方式</label>
          <select name="auth_type" id="auth-type" onchange="onAuthChange()">
            <option value="key">密钥</option>
            <option value="password">密码</option>
          </select>
        </div>
        <div id="key-section" class="form-row">
          <label>密钥</label>
          <select name="key_name" id="key-select" onchange="onKeySelectChange()">
            <option value="">-- 选择密钥 --</option>
          </select>
          <span class="hint" id="key-hint"></span>
        </div>
        <div id="pass-section" class="form-row hidden">
          <label>密码</label>
          <input type="password" name="password">
        </div>
      </div>
      <div class="form-row">
        <label>宽度</label>
        <input type="number" name="width" value="1280">
      </div>
      <div class="form-row">
        <label>高度</label>
        <input type="number" name="height" value="720">
      </div>
      <div class="form-row" id="quality-row">
        <label>画质</label>
        <select name="color_depth">
          <option value="24">24 位（高清）</option>
          <option value="16" selected>16 位（推荐，省带宽）</option>
          <option value="8">8 位（极速，画质较低）</option>
        </select>
      </div>
      <div class="form-row" id="vnc-quality-row">
        <label>画质</label>
        <select name="vnc_quality">
          <option value="high">高清（画质优先）</option>
          <option value="medium" selected>均衡（默认）</option>
          <option value="low">流畅（省带宽，抗卡顿）</option>
        </select>
      </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" onclick="closeModal()">取消</button>
        <button type="submit" class="btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- Keys Modal -->
<div id="keys-modal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h2>SSH 密钥管理</h2>
      <button class="close-btn" onclick="closeKeysModal()">&times;</button>
    </div>
    <div class="keys-toolbar">
      <input type="text" id="new-key-name" placeholder="新密钥名称">
      <button class="btn-primary" onclick="generateKey()">生成新密钥</button>
      <button class="btn-secondary" onclick="scanSSHKeys()">扫描 ~/.ssh</button>
    </div>
    <div id="keys-list" class="keys-list"></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeKeysModal()">关闭</button>
    </div>
  </div>
</div>

<!-- About Modal -->
<div id="about-modal" class="modal hidden">
  <div class="modal-content readme-modal">
    <div class="modal-header">
      <h2>关于</h2>
      <div class="about-actions">
        <a class="btn-secondary" href="https://www.github.com/hktalent/remote-connect-manager" target="_blank" rel="noopener noreferrer">GitHub 仓库</a>
        <button class="close-btn" onclick="closeAboutModal()">&times;</button>
      </div>
    </div>
    <div class="modal-body markdown-body" id="readme-content">加载中…</div>
  </div>
</div>

<!-- SFTP 文件管理 -->
<div id="sftp-modal" class="modal hidden">
  <div class="modal-content sftp-modal">
    <div class="modal-header">
      <h2 id="sftp-title">文件管理</h2>
      <div class="about-actions">
        <button id="sftp-upload-btn" class="btn-secondary">上传</button>
        <button id="sftp-mkdir-btn" class="btn-secondary">新建目录</button>
        <button class="close-btn" onclick="closeSftpModal()">&times;</button>
      </div>
    </div>
    <div class="sftp-pathbar">
      <button id="sftp-up" title="上级目录">↑</button>
      <input id="sftp-path" type="text" spellcheck="false" placeholder="/">
      <button id="sftp-go">转到</button>
    </div>
    <div class="modal-body sftp-list" id="sftp-list"></div>
  </div>
</div>

<!-- RDP 共享盘下载 -->
<div id="drive-modal" class="modal hidden">
  <div class="modal-content sftp-modal">
    <div class="modal-header">
      <h2 id="drive-title">共享盘</h2>
      <div class="about-actions">
        <button id="drive-refresh" class="btn-secondary">刷新</button>
        <button class="close-btn" onclick="closeDriveModal()">&times;</button>
      </div>
    </div>
    <div class="sftp-pathbar">
      <button id="drive-up" title="上级目录">↑</button>
      <input id="drive-path" type="text" spellcheck="false" placeholder="/" readonly>
    </div>
    <p class="hint">把远端桌面里的文件复制/拖入共享盘（Windows: \\tsclient\rcm，Linux: ~/thinclient_drives），即可在此下载。</p>
    <div class="modal-body sftp-list" id="drive-list"></div>
  </div>
</div>

<!-- SSH 端口转发 -->
<div id="tunnel-modal" class="modal hidden">
  <div class="modal-content tunnel-modal">
    <div class="modal-header">
      <h2 id="tunnel-title">端口转发</h2>
      <button class="close-btn" onclick="closeTunnelModal()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="tunnel-form" class="tunnel-form">
        <input name="remote_host" placeholder="目标主机（默认 127.0.0.1）" spellcheck="false">
        <input name="remote_port" type="number" min="1" max="65535" placeholder="目标端口" required>
        <button type="submit" class="btn-primary">创建隧道</button>
      </form>
      <p class="hint">创建后通过 <code>localhost:&lt;本地端口&gt;</code> 访问；Docker 已映射 20000-20010。</p>
      <div id="tunnel-list" class="tunnel-list"></div>
    </div>
  </div>
</div>

<!-- Session Viewer -->
<div id="session-viewer" class="session-viewer hidden">
  <div class="session-header">
    <span id="session-title"></span>
    <div class="session-controls">
      <button id="btn-upload" title="上传文件到远程共享盘" class="hidden">⇪</button>
      <button id="btn-drive" title="共享盘文件下载" class="hidden">🖴</button>
      <button id="btn-sftp" title="文件管理（SFTP）" class="hidden">🗂</button>
      <button id="btn-tunnel" title="端口转发" class="hidden">⇄</button>
      <button id="btn-zoom-out" title="缩小">−</button>
      <button id="btn-zoom-reset" title="重置">⟲</button>
      <button id="btn-zoom-in" title="放大">+</button>
      <button id="btn-fullscreen" title="全屏">⛶</button>
      <button id="btn-minimize" title="最小化到卡片">↘</button>
      <button id="btn-close-session" title="关闭" class="danger">✕</button>
    </div>
  </div>
  <div id="session-body" class="session-body"></div>
</div>

<!-- 最小化后的会话离屏保活容器 -->
<div id="session-pool" aria-hidden="true"></div>

<!-- 依赖全部本地化，避免 CDN 不可达导致页面功能失效 -->
<script src="/vendor/xterm/xterm.js"></script>
<script src="/vendor/xterm/xterm-addon-fit.js"></script>
<script src="/vendor/xterm/xterm-addon-canvas.js"></script>
<!-- noVNC 与 guacamole 均为 ES Module，以 module 方式加载后挂到 window -->
<script type="module">
  import RFB from '/vendor/novnc/core/rfb.js';
  window.RFB = RFB;
</script>
<script type="module">
  import Guacamole from '/vendor/guacamole/guacamole-common.min.js';
  window.Guacamole = Guacamole;
</script>
<script src="/js/app.js?v=20261117g"></script>
</body>
</html>
